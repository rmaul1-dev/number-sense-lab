  const pz = G.puz, v = pz.numbers[+i];
  if (String(v) === String(pz.answer)) { el.classList.add('good'); return kakSolved(true); }
  G.tries++; G.step++; el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 600);
  if (G.step === 1) setHint('Hmm, can two others make ' + esc(v) + '? Let’s think.<br>' + kakHintText(1));
  else if (G.step === 2) setHint('Good try! Let’s narrow it down.<br>' + kakHintText(2));
  else kakReveal();
};
function markParts() {
  const pz = G.puz; const used = new Set();
  pz.numbers.forEach((v, i) => { const el = document.getElementById('t' + i); if (!el) return;
    if (String(v) === String(pz.answer)) el.classList.add('good');
    else if (pz.parts.map(String).indexOf(String(v)) >= 0 && !used.has(String(v))) { used.add(String(v)); el.classList.add('part'); }
    else el.classList.add('dim'); });
}
function kakReveal() { G.done = true; stopSpeedBar(); markParts(); kakRecord(false); setHint('<b>Here it is:</b><div class="eq">' + esc(G.puz.equation) + '</div>' + esc(fastWay(G.puz)), 'reveal'); kakAfter(); }
function kakSolved() {
  const ok = G.tries === 0 && G.hints === 0, ms = Date.now() - G.t0;
  G.done = true; stopSpeedBar(); markParts(); kakRecord(ok, ms);
  const fast = ok && ms < G.puz.numbers.length * KMODES.find(m => m.id === G.mode).perNum;
  setHint('<div class="eq">' + esc(G.puz.equation) + '</div>' + (fast ? pick(QUICK) : pick(CHEERS)) + ' <span class="muted">(' + (ms / 1000).toFixed(1) + 's)</span>' + (G.unlockMsg ? '<div style="margin-top:6px">' + G.unlockMsg + '</div>' : ''), 'reveal');
  kakAfter(true);
}
function kakRecord(ok, ms) {
  const p = me(), k = p.kak; G.unlockMsg = '';
  ms = ms || (Date.now() - G.t0);
  if (G.meta) { if (G.mi < G.meta.minis.length) { G.collected.push(G.puz.answer); record('kakooma', ok, ms); return; }
    record('kakooma', ok, Date.now() - G.t0meta, ok ? 'kakmeta:' + G.mode : null); return; }
  const g = k.group[G.mode] || 4, mdef = KMODES.find(m => m.id === G.mode);
  record('kakooma', ok, ms, ok ? 'kak:' + G.mode : null);
  if (ok && ms < g * mdef.perNum) { k.streakUp++; k.missRow = 0; } else if (!ok) { k.missRow++; k.streakUp = 0; } else { k.streakUp = 0; k.missRow = 0; }
  if (k.streakUp >= 3 && g < mdef.maxG) { k.group[G.mode] = g + 1; k.streakUp = 0; G.unlockMsg = '📈 Bigger puzzles now: ' + (g + 1) + ' numbers!'; }
  if (k.missRow >= 2 && g > 4) { k.group[G.mode] = g - 1; k.missRow = 0; }
  // unlock next mode: quick+accurate at top-ish group size
  const mi = KMODES.findIndex(m => m.id === G.mode);
  k.hist = (k.hist || []).concat([{ m: G.mode, ok, fast: ok && ms < g * mdef.perNum, g }]).slice(-10);
  const recent = k.hist.filter(h => h.m === G.mode && h.g >= Math.min(mdef.maxG, 6) - (G.mode === 'add12' ? 1 : 0));
  if (mi < KMODES.length - 1 && !kakUnlocked(p, KMODES[mi + 1].id) && recent.length >= 8 && recent.filter(h => h.ok && h.fast).length >= 7) {
    k.unlocked.push(KMODES[mi + 1].id); G.unlockMsg = '🔓 New level unlocked: ' + KMODES[mi + 1].label + '!';
  }
  save();
}
function kakAfter(solved) {
  const p = me();
  const lastOfMeta = G.meta && G.mi >= G.meta.minis.length;
  const isMini = G.meta && !lastOfMeta;
  const nextLabel = isMini ? (G.mi + 1 < G.meta.minis.length ? 'Next mini ▶' : 'Final puzzle ▶') : G.meta ? 'Done ▶' : 'Next ▶';
  const nextAct = isMini ? 'kakMetaNext' : G.meta ? 'kakHome' : 'kakNext';
  document.getElementById('kakActions').innerHTML = '<button class="btn" data-act="' + nextAct + '">' + nextLabel + '</button>';
  // Flip it! (optional fact-family follow-up) — after regular puzzles and the final meta puzzle
  if (solved && p.flipIt && !isMini) {
    const f = P.buildFlipIt(G.puz);
    if (f) { G.flip = f; G.flipTries = 0;
      document.getElementById('flip').innerHTML = '<div class="card" style="min-height:0;margin-top:12px"><div class="row"><div class="big" style="font-size:22px">🔄 Flip it!</div><span class="spacer"></span><button class="btn ghost small" data-act="flipSkip">Skip</button></div>' +
        '<div class="problem" style="font-size:44px">' + esc(f.prompt) + '</div><div class="choices">' + f.choices.map(c => '<button class="choice" data-act="flipAns" data-arg="' + c + '">' + c + '</button>').join('') + '</div><div id="flipMsg" class="muted" style="font-size:18px;text-align:center"></div></div>';
      setTimeout(() => { const fe = document.getElementById('flip'); fe && fe.scrollIntoView && fe.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 350); }
  }
}
ACT.flipSkip = () => { const f = document.getElementById('flip'); if (f) f.innerHTML = ''; };
ACT.flipAns = (v, el) => {
  const f = G.flip; if (!f || f.done) return;
  const msg = document.getElementById('flipMsg');
  if (+v === f.answer) { f.done = true; el.classList.add('good'); msg.innerHTML = '🌟 ' + esc(f.explain) + '<br>Same three numbers — a fact family!'; record('flipit', G.flipTries === 0, 0); return; }
  G.flipTries++; el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 600);
  if (G.flipTries === 1) msg.innerHTML = '🤔 Think backwards: ' + (f.kind === 'div' ? 'what times the number you divide by gives the big number?' : 'what do you add to the smaller number to get the big one?');
  else { f.done = true; msg.innerHTML = 'Here it is: <b>' + esc(f.explain) + '</b>'; record('flipit', false, 0); }
};
ACT.kakNext = () => nextKak();
ACT.kakMetaNext = () => { G.mi++; nextKak(); };

/* ---------------- PARENT VIEW ---------------- */
function goParent() {
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const html = S.players.map(p => {
    const maxSec = Math.max(SESSION_GOAL_SEC, ...days.map(d => (p.days[todayKey(d)] || {}).sec || 0));
    const bars = '<div class="bars">' + days.map(d => { const r = p.days[todayKey(d)] || {}; return '<div class="' + (r.goalMet ? 'goal' : '') + '" style="height:' + Math.round((r.sec || 0) / maxSec * 100) + '%" title="' + Math.round((r.sec || 0) / 60) + ' min"></div>'; }).join('') + '</div>' +
      '<div class="bars-labels">' + days.map(d => '<span>' + (d.getMonth() + 1) + '/' + d.getDate() + '</span>').join('') + '</div>';
    const rows = days.slice().reverse().filter(d => p.days[todayKey(d)]).map(d => { const r = p.days[todayKey(d)];
      return '<tr><td>' + (d.getMonth() + 1) + '/' + d.getDate() + '</td><td>' + Math.round(r.sec / 60) + '</td><td>' + r.items + '</td><td>' + (r.items ? Math.round(r.ok / r.items * 100) + '%' : '–') + '</td><td>' + (r.items ? (r.msSum / r.items / 1000).toFixed(1) + 's' : '–') + '</td><td>' + (r.goalMet ? '✅' : '') + '</td></tr>'; }).join('');
    const ci = currentSkillIndex(p);
    const path = SKILLS.map((s, i) => { const st = p.skills[s.id], un = skillUnlocked(p, i);
      const h = st.hist, acc = h.length ? Math.round(h.filter(x => x.ok).length / h.length * 100) : (st.total ? Math.round(st.ok / st.total * 100) : null), med = median(h.filter(x => x.ok).map(x => x.ms));
      let status, note = '';
      if (st.mastered) status = '⭐ Mastered';
      else if (!un) status = '🔒 Not yet';
      else if (st.total === 0) status = '▶ Up next';
      else { status = '🔵 Level ' + (st.level + 1) + '/' + s.levels + ': ' + s.levelNames[st.level];
        const stuck = st.levelAttempts >= 40 || (h.length >= 10 && acc < 70);
        const slow = h.length >= 10 && acc >= 90 && med > s.targetMs;
        if (stuck) note = '⚠️ <b>Stuck here</b> — ' + s.help;
        else if (slow) note = '🐢 Accurate but still slow (median ' + (med / 1000).toFixed(1) + 's vs ' + (s.targetMs / 1000) + 's goal) — more short practice builds speed.'; }
      return '<tr' + (i === ci && !st.mastered ? ' style="background:var(--panel2)"' : '') + '><td style="text-align:left">' + s.emoji + ' ' + s.title + '</td><td style="text-align:left">' + status + (note ? '<div style="font-size:15px;color:var(--accent)">' + note + '</div>' : '') + '</td><td>' + (acc === null ? '–' : acc + '%') + '</td><td>' + (med ? (med / 1000).toFixed(1) + 's' : '–') + '</td><td>' + st.total + '</td></tr>'; }).join('');
    const kakTop = KMODES.filter(m => kakUnlocked(p, m.id)).map(m => m.short).join(', ');
    const bests = Object.keys(p.best).filter(k => k.indexOf('kak') === 0).map(k => k.replace('kakmeta:', 'Puzzle-in-a-Puzzle ').replace('kak:', '') + ': ' + (p.best[k] / 1000).toFixed(1) + 's').join(' · ');
    return '<div class="card" style="min-height:0"><div class="row"><h2 style="flex:1">' + esc(p.name) + '</h2><span class="chip">🔥 ' + streak(p) + '-day streak</span><button class="edit" data-act="rename" data-arg="' + p.id + '">✏️ Rename</button></div>' +
      '<b>Minutes per day (last 14 days; green = 10-min goal met)</b>' + bars +
      '<b style="margin-top:10px">Foundations path</b><table><tr><th style="text-align:left">Skill</th><th style="text-align:left">Status</th><th>Recent acc.</th><th>Median time</th><th>Total</th></tr>' + path + '</table>' +
      '<b style="margin-top:10px">Kakooma</b><div class="muted">Unlocked: ' + kakTop + (bests ? '<br>Best times: ' + esc(bests) : '') + '</div>' +
      (rows ? '<b style="margin-top:10px">Daily log</b><table><tr><th>Day</th><th>Min</th><th>Problems</th><th>1st-try</th><th>Avg time</th><th>Goal</th></tr>' + rows + '</table>' : '<div class="muted">No play yet.</div>') +
      '<div class="row" style="margin-top:10px"><button class="btn secondary small" data-act="toggle" data-arg="' + p.id + ':unlockAllPath">' + (p.unlockAllPath ? '✅' : '⬜') + ' Unlock all path steps</button>' +
      '<button class="btn secondary small" data-act="toggle" data-arg="' + p.id + ':unlockAllKak">' + (p.unlockAllKak ? '✅' : '⬜') + ' Unlock all Kakooma levels</button>' +
      '<button class="btn secondary small" data-act="toggle" data-arg="' + p.id + ':flipIt">' + (p.flipIt ? '✅' : '⬜') + ' “Flip it” follow-ups</button>' +
      '<button class="btn ghost small" data-act="resetP" data-arg="' + p.id + '">Reset data</button></div></div>';
  }).join('');
  const prev = S.current; S.current = prev;
  render('<div class="topbar"><button class="btn secondary small" data-act="' + (prev ? 'hub' : 'home') + '">◀</button><div class="title">👪 Grown-ups</div></div><div class="screen">' +
    '<p class="muted">Mastery rule: a level unlocks after 9 of the last 10 answers are right on the first try (no hints) at a comfortable speed. Everything is stored only on this iPad.</p>' + html + '</div>', false);
}
ACT.parent = goParent;
ACT.toggle = arg => { const [id, key] = arg.split(':'); const p = S.players.find(x => x.id === id); p[key] = !p[key]; save(); goParent(); };
ACT.resetP = id => { const p = S.players.find(x => x.id === id); modal('<h2>Reset ' + esc(p.name) + '?</h2><p>This erases all progress for this player on this iPad.</p><button class="btn" data-act="resetYes" data-arg="' + id + '">Yes, reset</button><button class="btn ghost" data-act="closeModal">Cancel</button>'); };
ACT.resetYes = id => { const i = S.players.findIndex(x => x.id === id), old = S.players[i]; S.players[i] = mkPlayer(old.id, old.name, old.color); save(); closeModal(); goParent(); };

/* ---------------- ABOUT ---------------- */
ACT.about = () => render(topbar('About', 'home') + '<div class="screen"><div class="idea"><h2>' + APP_NAME + '</h2>' +
  '<p>A private family practice app. No accounts, no ads, no tracking, no internet needed. Progress stays on this iPad.</p><br>' +

  '<p>This app is not made by or affiliated with Greg Tang or Tang Math. To support his work and play the real thing, visit:</p>' +
  '<p><a href="https://tangmath.com" target="_blank" rel="noopener">tangmath.com</a> · <a href="https://app.tangmath.com" target="_blank" rel="noopener">app.tangmath.com</a> · <a href="https://gregtangmath.com" target="_blank" rel="noopener">gregtangmath.com</a> · <a href="http://www.gregtang.com" target="_blank" rel="noopener">gregtang.com</a></p></div></div>');

/* ---------------- boot ---------------- */
if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.NSL = { S, goHome, goHub, goParent, ACT, get G() { return G; } }; // for testing
S.current ? goHub() : goHome();
})();
